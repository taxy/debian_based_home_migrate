[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-tracker"
version = "0.1.0"
description = "Track Debian package snapshots and compare package state over time."
requires-python = ">=3.11"

[project.scripts]
pkg-tracker = "pkg_tracker.cli:main"

[tool.setuptools]
packages = ["pkg_tracker"]